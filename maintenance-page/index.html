<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>筑巢英语 - 服务维护中</title>
    <meta
      name="description"
      content="筑巢英语正在进行备案与服务维护，期间网站功能暂时不可用。"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #152033;
        --muted: #5f6d80;
        --line: #d9e1ec;
        --accent: #2563eb;
        --accent-soft: #e8f0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.10), transparent 32%),
          linear-gradient(135deg, #f9fbff 0%, var(--bg) 100%);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(720px, 100%);
        padding: 40px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(21, 32, 51, 0.10);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        margin-bottom: 28px;
      }

      .brand img {
        display: block;
        width: min(220px, 70vw);
        height: auto;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 6vw, 48px);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .notice {
        margin-top: 28px;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fbfdff;
      }

      .meta {
        display: grid;
        gap: 8px;
        margin-top: 28px;
        color: var(--muted);
        font-size: 14px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 560px) {
        main {
          padding: 28px 22px;
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="./logo-full.svg" alt="筑巢英语" width="300" height="80" />
      </div>

      <h1>服务维护中</h1>
      <p>
        我们正在进行备案主体调整与服务迁移。维护期间，线上学习服务暂时不可用。
      </p>

      <div class="notice">
        <p>
          备案完成后，筑巢英语会恢复正常访问。感谢你的理解与等待。
        </p>
      </div>

      <div class="meta">
        <span>域名：nestenglish.com</span>
        <span>联系邮箱：<a href="mailto:pjymegan@gmail.com">pjymegan@gmail.com</a></span>
      </div>
    </main>
  </body>
</html>
