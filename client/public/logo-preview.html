<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Logo Preview</title>
  <style>
    body { font-family: sans-serif; background: #f5f1eb; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px; }
    .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .card-dark { background: #2d2825; }
    label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    .label-dark { color: #666; }
    .row { display: flex; gap: 40px; }
    img { display: block; }
  </style>
</head>
<body>
  <h2 style="color:#8b5e1a;margin:0">nest · Logo Preview</h2>

  <div class="row">
    <!-- Icon mark -->
    <div class="card">
      <label>Icon mark (light bg)</label>
      <img src="logo.svg" width="120" height="120">
    </div>
    <div class="card card-dark">
      <label class="label-dark">Icon mark (dark bg)</label>
      <img src="logo.svg" width="120" height="120">
    </div>
  </div>

  <div class="row">
    <!-- Full wordmark -->
    <div class="card">
      <label>Full logo (light bg)</label>
      <img src="logo-full.svg" width="260" height="80">
    </div>
  </div>

  <div class="row">
    <!-- Different sizes -->
    <div class="card">
      <label>32px</label>
      <img src="logo.svg" width="32" height="32">
    </div>
    <div class="card">
      <label>48px</label>
      <img src="logo.svg" width="48" height="48">
    </div>
    <div class="card">
      <label>64px</label>
      <img src="logo.svg" width="64" height="64">
    </div>
    <div class="card">
      <label>96px</label>
      <img src="logo.svg" width="96" height="96">
    </div>
  </div>
</body>
</html>
