    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.PROD) {
          // Register the removal worker once so existing installs update to a
          // worker that clears legacy caches and unregisters itself.
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((error) => {
              console.warn('Service worker registration cleanup failed:', error);
            });
          });
        } else {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
            .then(() => ('caches' in window ? window.caches.keys() : []))
            .then((keys) => Promise.all(
              (keys || [])
                .filter((key) => key.startsWith('nest-'))
                .map((key) => window.caches.delete(key))
            ))
            .catch((error) => {
              console.warn('Legacy service worker cleanup failed:', error);
            });
        }
      }
    </script>
