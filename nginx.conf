server {
    listen 80;
    server_name www.nestenglish.com;
    return 301 https://nestenglish.com$request_uri;
}

server {
    listen 80;
    server_name _;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nestenglish.com www.nestenglish.com;

    ssl_certificate     /etc/letsencrypt/live/nestenglish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestenglish.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (supplement app-level Helmet headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Proxy all /api/* to the Node.js backend
    location /api/ {
        proxy_pass         http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # SSE: disable buffering so chunks reach the browser immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;

        # Do NOT send X-Accel-Buffering here; the app sets it per-response
    }

    # Static assets — long-lived cache for hashed filenames
    location /assets/ {
        proxy_pass       http://app:3001;
        proxy_set_header Host $host;
        expires          1y;
        add_header       Cache-Control "public, immutable";
        access_log       off;
    }

    # Everything else → SPA index.html (client-side routing)
    location / {
        proxy_pass         http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No cache for the HTML shell (always fetch latest)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
